site_name: BarProbe
site_description: >-
  Reference and guides for BarProbe, an Android barcode toolkit for functionality
  testing, security testing, and configuration.
site_url: https://ryarmst.github.io/BarProbe/
repo_url: https://github.com/ryarmst/BarProbe
repo_name: ryarmst/BarProbe

# The docs are authored as plain Markdown under docs/. The Learn articles are the same
# files the app compiles into its in-app content; the Reference pages are generated
# from the symbology registry by the Pages workflow before this builds.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
