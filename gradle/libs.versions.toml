[versions]
# Toolchain.
#
# KSP no longer uses the old <kotlin>-<ksp> scheme: KSP2 versions independently, and
# 2.3.11 is its current release. It is deliberately not required to match Kotlin, but
# it does drive Room and Hilt code generation, so after bumping Kotlin re-run the KSP
# tasks with --rerun-tasks and check for version warnings before trusting the build.
#
# Kotlin 2.4.10 verified against KSP 2.3.11: no mismatch warnings, kotlin-stdlib
# resolves to 2.4.10 across the whole runtime classpath, and the full suite passes.
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"

# SDK levels. minSdk is 26 deliberately: rugged industrial scanners, which
# feature 4 targets, often run older Android builds.
compileSdk = "37"
minSdk = "26"
targetSdk = "37"

# NDK / native. Pinned so the native build is reproducible.
ndk = "28.2.13676358"
cmake = "3.31.6"

androidxCore = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
room = "2.8.4"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
datastore = "1.2.1"
camerax = "1.6.1"
zxingcppAndroid = "3.1.1"
coroutines = "1.11.0"
serialization = "1.11.0"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
robolectric = "4.16.1"
truth = "1.4.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose is versioned through the BOM; individual artifacts stay version-less.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Test-only. Frozen upstream at 1.7.8 (last release Feb 2025) while the rest of Compose
# moved on; see WorkbenchIcons for why the app vendors its seven icons instead.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Reader engine. Prebuilt native AAR, all four ABIs, no local NDK build needed.
zxingcpp-android = { group = "io.github.zxing-cpp", name = "android", version.ref = "zxingcppAndroid" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# Home of hiltViewModel() since 1.3. It arrives transitively via hilt-navigation-compose,
# but the screens import it directly, so it is declared directly.
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltNavigationCompose" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.7.0" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android alias: AGP 9 has Kotlin built in for Android modules and rejects
# the standalone plugin. Only the JVM-only modules apply kotlin-jvm.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Compose compiler ships with Kotlin from 2.0 onward, so it shares the version.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
