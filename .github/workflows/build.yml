name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository or publishes anything.
permissions:
  contents: read

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    # libzint is compiled from source for three ABIs, so this is slower than a
    # pure-JVM Android build. The limit is generous rather than tight.
    timeout-minutes: 60

    # Signing secrets are exposed as job-level env so steps can test for their
    # presence (a secret cannot be read in a step `if:` otherwise) and so the Gradle
    # build picks them up via signingParam(). They are empty on fork PRs and before
    # the secrets are configured, in which case the release build falls back to the
    # debug key. GitHub masks these values in logs.
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      # JDK 21 is what the build is verified against locally. AGP 9 needs 17 or
      # newer; the bytecode target is 17 regardless and is set per module.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Read the pinned versions out of the version catalog instead of repeating
      # them here. The NDK and CMake versions are pinned so the native build is
      # reproducible, and a second copy in CI would eventually disagree with it.
      #
      # build-tools is the exception: it is not pinned by the project, so this is
      # AGP 9.3.1's own default. If an AGP bump fails here with a missing
      # build-tools, check the new default and update this line.
      - name: Install pinned SDK components
        run: |
          set -euo pipefail
          NDK=$(grep -E '^ndk = ' gradle/libs.versions.toml | cut -d'"' -f2)
          CMAKE=$(grep -E '^cmake = ' gradle/libs.versions.toml | cut -d'"' -f2)
          API=$(grep -E '^compileSdk = ' gradle/libs.versions.toml | cut -d'"' -f2)

          # Platforms are now published with a minor version, and inconsistently:
          # API 36 is "android-36" but API 37 is "android-37.0". Asking for
          # "android-37" fails outright. compileSdk = 37 means major 37, minor 0,
          # so take the lowest minor rather than the newest.
          PLATFORM=$(sdkmanager --list 2>/dev/null \
            | grep -oE "platforms;android-${API}(\.[0-9]+)?" \
            | sort -Vu | head -1)
          if [ -z "$PLATFORM" ]; then
            echo "::error::No SDK platform package found for compileSdk $API"
            exit 1
          fi

          echo "NDK=$NDK  CMake=$CMAKE  platform=$PLATFORM"
          sdkmanager --install \
            "$PLATFORM" \
            "build-tools;36.0.0" \
            "ndk;$NDK" \
            "cmake;$CMAKE"

      # Also validates gradle-wrapper.jar against published Gradle releases
      # (validate-wrappers defaults to true), which matters because that jar is a
      # binary committed to the repository.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Kept as separate invocations so a red run says which stage failed
      # without opening the log.
      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew :app:lintRelease

      # Decode the upload keystore from its secret so release artifacts are signed with
      # the real key. When the secret is absent the Gradle build falls back to the debug
      # key. The secret is read from the env (not interpolated inline) so its value is
      # never on a command line, and the keystore is written under RUNNER_TEMP -- outside
      # the checkout, so it cannot be committed or swept into an artifact.
      - name: Decode signing keystore
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # On a tag, the version has to reach Gradle before the APKs are built: the
      # release job only repackages what this job produced. Without it a release
      # tagged v1.2.3 would ship an APK reporting 0.1.0-dev, and every release
      # would carry the same versionCode and refuse to install over the last one.
      - name: Build release APKs
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "building release version $RELEASE_VERSION"
          fi
          ./gradlew assembleRelease

      # The Android App Bundle is what Google Play accepts, so it is built only for a
      # tagged release and only when signing is configured (a debug-signed bundle is
      # useless to Play). It is kept as a private workflow artifact for the maintainer
      # to upload through the Play Console -- deliberately not attached to the public
      # GitHub release, which carries the sideloadable APKs.
      - name: Build release AAB (Play)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          ./gradlew bundleRelease

      - name: Upload AAB
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # Per-ABI APKs, signed with the debug key. Installable for testing, not
      # distributable.
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Publishes the APKs the build job already produced and tested. It deliberately
  # does not rebuild: the binary attached to a release should be the one the tests
  # ran against, not a second build that happens to come from the same commit.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release and upload assets

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apks-${{ github.sha }}
          path: apks

      - name: Name the files after the release and checksum them
        id: prep
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          for apk in apks/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/BarProbe-${VERSION}-${abi}.apk"
          done

          cd dist
          sha256sum *.apk > SHA256SUMS
          ls -la
          cat SHA256SUMS

      # gh is preinstalled on the runner, so this needs no third-party action.
      # A tag containing a hyphen (v1.0.0-rc1) is treated as a prerelease.
      #
      # GH_REPO is required because this job has no checkout: gh normally works out
      # which repository it is talking to by reading git metadata, and without it
      # fails with "not a git repository". Naming the repo is the right fix rather
      # than cloning the source, which this job has no other use for.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi

          cat > notes.md <<EOF
          Built from \`${GITHUB_SHA}\` by the Build workflow, after its tests and lint passed.

          ### Which file

          One APK per ABI; there is no universal build. \`arm64-v8a\` is right for
          essentially every phone from the last several years. \`armeabi-v7a\` is for
          older 32-bit devices and \`x86_64\` for emulators.

          Verify a download against \`SHA256SUMS\`.

          ### Signing

          These sideload APKs are signed with the project's upload key (or, if the
          signing secret was not configured for this build, the public Android debug
          key). Either way they are **not** the same signature as installs from Google
          Play: Play re-signs with its own app-signing key. So a build installed from
          here and a build installed from Play cannot update each other -- to switch
          between them you must uninstall first. Verify a download against \`SHA256SUMS\`.
          EOF

          gh release create "v${VERSION}" \
            --title "BarProbe ${VERSION}" \
            --notes-file notes.md \
            $PRERELEASE \
            dist/*.apk dist/SHA256SUMS
